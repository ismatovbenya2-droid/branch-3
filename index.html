<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalyst Analytics</title>
    <link rel="stylesheet" href="./src/output.css" />
  </head>
  <body class="bg-[#030303] text-white overflow-x-hidden">
    <div class="relative min-h-screen">
      <div
        class="pointer-events-none absolute right-[-120px] top-[120px] h-[420px] w-[420px] rounded-full bg-[#0A84FF]/20 blur-[130px]"
      ></div>
      <div
        class="pointer-events-none absolute left-0 top-[90px] hidden h-[420px] w-full opacity-20 lg:block"
        style="
          background-image: radial-gradient(#1f1f1f 1px, transparent 1px);
          background-size: 26px 26px;
        "
      ></div>
      <header class="relative z-20">
        <div
          class="mx-auto flex max-w-[1200px] items-center justify-between px-4 py-6 lg:px-6"
        >
          <a href="index.html" class="shrink-0">
            <img
              src="./src/img/Logo (8).png"
              alt="Catalyst Analytics"
              class="h-auto w-[120px] lg:w-[140px]"
            />
          </a>
          <nav class="hidden lg:block">
            <ul class="flex items-center gap-8 text-[14px] text-white/80">
              <li><a class="transition hover:text-white" href="index.html">Home</a></li>
              <li><a class="transition hover:text-white" href="page2.html">Services</a></li>
              <li><a class="transition hover:text-white" href="page3.html">Careers</a></li>
              <li><a class="transition hover:text-white" href="page4.html">Career Details</a></li>
              <li><a class="transition hover:text-white" href="page5.html">Contact</a></li>
            </ul>
          </nav>

          <button
            class="rounded-xl bg-[#0A84FF] px-5 py-3 text-sm font-medium transition hover:bg-[#0c76e0] lg:px-7"
          >
            Contact Us
          </button>
        </div>
      </header>
      <section class="relative z-10">
        <div
          class="mx-auto flex max-w-[1200px] flex-col items-center gap-10 px-4 pb-12 pt-6 lg:flex-row lg:justify-between lg:px-6 lg:pb-16 lg:pt-10"
        >
          <aside class="max-w-[560px] text-center lg:text-left">
            <h1
              class="text-[40px] font-bold leading-[1.05] sm:text-[48px] lg:text-[64px]"
            >
              Transforming Data
              <br />
              into
              <span
                class="inline-block rounded-2xl bg-[#0A84FF] px-4 py-1.5 text-white"
              >
                Decisions
              </span>
            </h1>

            <p class="mt-6 max-w-[520px] text-[15px] leading-7 text-white/70 lg:text-[16px]">
              Leverage the power of machine learning and AI to unlock insights
              and drive business growth
            </p>

            <button
              class="mt-8 rounded-xl bg-[#0A84FF] px-6 py-3 text-sm font-medium transition hover:bg-[#0c76e0]"
            >
              Book a Meeting
            </button>

            <div
              class="mt-8 flex flex-col items-center gap-3 text-sm text-white/70 sm:flex-row lg:items-center lg:justify-start"
            >
              <img
                src="./src/img/Group 20.png"
                alt="Clients"
                class="h-auto w-[90px]"
              />
              <p>Over 100+ clients have worked with us.</p>
            </div>
          </aside>
          <div class="relative flex justify-center lg:w-[46%]">
            <div
              class="absolute bottom-10 right-10 h-[250px] w-[250px] rounded-full bg-[#0A84FF]/20 blur-[100px]"
            ></div>
            <img
              src="./src/img/robot area.png"
              alt="Robot"
              class="relative z-10 w-[300px] sm:w-[380px] lg:w-full"
            />
          </div>
        </div>
      </section>
      <section class="relative z-10">
        <div class="mx-auto max-w-[1200px] px-4 lg:px-6">
          <div class="border-y border-[#171717] py-8">
            <div
              class="flex flex-wrap items-center justify-center gap-x-8 gap-y-6 lg:justify-between"
            >
              <img src="./src/img/Card (1).png" alt="Zapier" class="h-auto" />
              <img src="./src/img/Card (2).png" alt="Spotify" class="h-auto" />
              <img src="./src/img/Card (3).png" alt="Zoom" class="h-auto" />
              <img src="./src/img/Card (4).png" alt="Slack" class="h-auto" />
              <img src="./src/img/Card (5).png" alt="Amazon" class="h-auto" />
              
            </div>
          </div>
        </div>
      </section>
    
    </div>
  </body>
</html>
